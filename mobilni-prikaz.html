<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Mobilni prikaz kartoteke · Dr Kunić</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:24px 12px;background:#e8efec;color:#17332f;font:14px system-ui,sans-serif}
    header{max-width:430px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    h1{margin:0;font-size:18px}
    a{color:#285f50}
    .phone{width:min(100%,390px);height:min(844px,calc(100dvh - 100px));min-height:500px;margin:auto;overflow:hidden;border:10px solid #17332f;border-radius:32px;background:white;box-shadow:0 18px 50px #17332f33}
    iframe{display:block;width:100%;height:100%;border:0;background:white}
    @media(max-width:450px){body{padding:12px 6px}header{padding:0 6px}.phone{height:calc(100dvh - 75px);min-height:0;border-width:5px;border-radius:18px}}
  </style>
</head>
<body>
  <header><h1>Mobilni prikaz kartoteke</h1><a href="./">Otvori punu stranicu</a></header>
  <div class="phone"><iframe src="./" title="Kartoteka u mobilnoj širini"></iframe></div>
</body>
</html>
